query Blogs(
  $first: Int!
  $after: String
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  blogs(first: $first, after: $after) {
    pageInfo { hasNextPage endCursor }
    nodes { id handle title }
  }
}
