query Locations(
  $first: Int!
  $after: String
  $near: GeoCoordinateInput
  $sortKey: LocationSortKeys
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  locations(first: $first, after: $after, near: $near, sortKey: $sortKey) {
    pageInfo { hasNextPage endCursor }
    nodes { id name address { ...LocationAddress } }
  }
}
