mutation CartLinesRemove(
  $cartId: ID!
  $lineIds: [ID!]!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  cartLinesRemove(cartId: $cartId, lineIds: $lineIds) {
    cart { ...Cart }
    userErrors { ...CartUserError }
    warnings { ...CartWarning }
  }
}
