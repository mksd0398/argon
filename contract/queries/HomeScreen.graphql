query HomeScreen(
  $handle: String!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  metaobject(handle: { type: "mobile_screen", handle: $handle }) {
    field(key: "sections") {
      references(first: 20) {
        nodes {
          __typename
          ... on Metaobject {
            id
            type
            fields {
              key
              value
              reference {
                __typename
                ... on MediaImage { image { ...Image } }
                ... on Collection {
                  ...CollectionCard
                  products(first: 24) { nodes { ...ProductCard } }
                }
              }
              references(first: 24) {
                nodes {
                  __typename
                  ... on Product { ...ProductCard }
                  ... on Collection { ...CollectionCard }
                }
              }
            }
          }
        }
      }
    }
  }
}
