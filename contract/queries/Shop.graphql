query Shop($country: CountryCode, $language: LanguageCode, $buyer: BuyerInput) @inContext(country: $country, language: $language, buyer: $buyer) {
  shop {
    id
    name
    description
    moneyFormat
    shipsToCountries
    primaryDomain { host url }
    brand {
      slogan
      shortDescription
      logo { image { ...Image } }
      squareLogo { image { ...Image } }
      coverImage { image { ...Image } }
      colors {
        primary { background foreground }
        secondary { background foreground }
      }
    }
    paymentSettings { currencyCode countryCode acceptedCardBrands supportedDigitalWallets enabledPresentmentCurrencies }
  }
}
