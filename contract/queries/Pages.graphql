query Pages(
  $first: Int!
  $after: String
  $query: String
  $sortKey: PageSortKeys
  $country: CountryCode
  $language: LanguageCode
) @inContext(country: $country, language: $language) {
  pages(first: $first, after: $after, query: $query, sortKey: $sortKey) {
    pageInfo { hasNextPage endCursor }
    nodes { id handle title bodySummary }
  }
}
