query Menu(
  $handle: String!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  menu(handle: $handle) {
    id
    handle
    title
    items {
      ...MenuItem
      items {
        ...MenuItem
        items { ...MenuItem }
      }
    }
  }
}
