mutation CartLinesAdd(
  $cartId: ID!
  $lines: [CartLineInput!]!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  cartLinesAdd(cartId: $cartId, lines: $lines) {
    cart { ...Cart }
    userErrors { ...CartUserError }
    warnings { ...CartWarning }
  }
}
