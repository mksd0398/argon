query StoreAvailability(
  $variantId: ID!
  $first: Int!
  $near: GeoCoordinateInput
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  node(id: $variantId) {
    __typename
    ... on ProductVariant {
      id
      storeAvailability(first: $first, near: $near) {
        nodes {
          available
          pickUpTime
          quantityAvailable
          location { id name address { ...LocationAddress } }
        }
      }
    }
  }
}
