mutation CartNoteUpdate(
  $cartId: ID!
  $note: String!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  cartNoteUpdate(cartId: $cartId, note: $note) {
    cart { ...Cart }
    userErrors { ...CartUserError }
    warnings { ...CartWarning }
  }
}
