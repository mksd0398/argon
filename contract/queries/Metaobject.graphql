query Metaobject(
  $type: String!
  $handle: String!
  $country: CountryCode
  $language: LanguageCode
  $buyer: BuyerInput
) @inContext(country: $country, language: $language, buyer: $buyer) {
  metaobject(handle: { type: $type, handle: $handle }) {
    id
    type
    handle
    updatedAt
    fields {
      key
      type
      value
      reference {
        __typename
        ... on MediaImage { image { ...Image } }
      }
    }
  }
}
