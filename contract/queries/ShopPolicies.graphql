query ShopPolicies($country: CountryCode, $language: LanguageCode) @inContext(country: $country, language: $language) {
  shop {
    privacyPolicy { ...Policy }
    refundPolicy { ...Policy }
    shippingPolicy { ...Policy }
    termsOfService { ...Policy }
    termsOfSale { ...Policy }
    legalNotice { ...Policy }
    contactInformation { ...Policy }
    subscriptionPolicy { id handle title body url }
  }
}
