query Product($handle: String!, $metafields: [HasMetafieldsIdentifier!]!) {
  product(handle: $handle) {
    id
    handle
    title
    vendor
    descriptionHtml
    media(first: 20) { nodes { ... on MediaImage { image { ...Image } } } }
    options { name optionValues { name } }
    variants(first: 250) {
      nodes {
        id
        title
        availableForSale
        selectedOptions { name value }
        price { ...Money }
        compareAtPrice { ...Money }
        image { ...Image }
      }
    }
    metafields(identifiers: $metafields) { namespace key value }
  }
}
