query Product(
  $handle: String!
  $metafields: [HasMetafieldsIdentifier!]!
  $selectedOptions: [SelectedOptionInput!]
  $country: CountryCode
  $language: LanguageCode
) @inContext(country: $country, language: $language) {
  product(handle: $handle) {
    id
    handle
    title
    vendor
    productType
    descriptionHtml
    availableForSale
    isGiftCard
    requiresSellingPlan
    encodedVariantExistence
    encodedVariantAvailability
    seo { title description }
    priceRange { minVariantPrice { ...Money } maxVariantPrice { ...Money } }
    media(first: 20) { nodes { ...Media } }
    options {
      id
      name
      optionValues {
        id
        name
        swatch { color image { __typename previewImage { ...Image } } }
        firstSelectableVariant { ...Variant }
      }
    }
    selectedOrFirstAvailableVariant(selectedOptions: $selectedOptions, ignoreUnknownOptions: true, caseInsensitiveMatch: true) {
      ...Variant
    }
    adjacentVariants(selectedOptions: $selectedOptions, ignoreUnknownOptions: true, caseInsensitiveMatch: true) { ...Variant }
    variants(first: 250) { nodes { ...Variant } }
    sellingPlanGroups(first: 10) {
      nodes {
        name
        appName
        options { name values }
        sellingPlans(first: 10) { nodes { id name description recurringDeliveries } }
      }
    }
    metafields(identifiers: $metafields) { namespace key type value }
  }
}
