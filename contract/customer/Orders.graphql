query Orders($first: Int!, $after: String, $sortKey: OrderSortKeys, $reverse: Boolean, $query: String) {
  customer {
    orders(first: $first, after: $after, sortKey: $sortKey, reverse: $reverse, query: $query) {
      pageInfo { hasNextPage endCursor }
      nodes {
        id
        name
        number
        processedAt
        financialStatus
        fulfillmentStatus
        cancelledAt
        latestFulfillmentDeliveryDate
        totalPrice { ...Money }
        lineItemsSummary { totalQuantityOfLineItems }
        lineItems(first: 3) { nodes { title image { url altText } } }
        fulfillments(first: 1) { nodes { latestShipmentStatus estimatedDeliveryAt } }
      }
    }
  }
}
