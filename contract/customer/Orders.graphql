query Orders($first: Int!, $after: String, $sortKey: OrderSortKeys, $reverse: Boolean, $query: String) {
  customer {
    orders(first: $first, after: $after, sortKey: $sortKey, reverse: $reverse, query: $query) {
      pageInfo { hasNextPage endCursor }
      nodes {
        id
        name
        number
        processedAt
        financialStatus
        fulfillmentStatus
        cancelledAt
        totalPrice { ...Money }
        lineItems(first: 50) { nodes { title quantity image { url altText } } }
        fulfillments(first: 1, sortKey: CREATED_AT, reverse: true) { nodes { latestShipmentStatus estimatedDeliveryAt updatedAt } }
      }
    }
  }
}
