query OrderReturnOptions($id: ID!) {
  order(id: $id) {
    id
    name
    returnInformation {
      hasRestockingFee
      hasReturnShippingFee
      returnShippingMethods
      returnShippingMethodNote
      returnFees {
        __typename
        title
        amountSet { presentmentMoney { ...Money } }
      }
      nonReturnableSummary { nonReturnableReasons }
      returnableLineItems(first: 50) {
        nodes {
          quantity
          lineItem {
            id
            title
            variantTitle
            sku
            image { url altText }
            productId
            variantId
            price { ...Money }
            suggestedReturnReasonDefinitions(first: 20) { nodes { id handle name } }
          }
        }
      }
    }
    returns(first: 10) { nodes { id name status createdAt } }
  }
}
