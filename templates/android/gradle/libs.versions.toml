[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
navigation = "2.9.8"
coil = "3.5.0"
browser = "1.10.0"
checkout = "3.6.3"
datastore = "1.2.1"
okhttp = "5.4.0"
serialization = "1.11.0"
coroutines = "1.11.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"
firebaseBom = "35.0.0"
facebook = "18.3.0"
moengage = "15.04.00"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
checkout-sheet-kit = { module = "com.shopify:checkout-sheet-kit", version.ref = "checkout" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# The analytics providers: each is in an app only when the store set it up (app/build.gradle.kts).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
facebook-core = { module = "com.facebook.android:facebook-core", version.ref = "facebook" }
moengage = { module = "com.moengage:moe-android-sdk", version.ref = "moengage" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 compiles Kotlin itself (built-in Kotlin); this plugin's version also lifts AGP's bundled Kotlin to `kotlin`.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
