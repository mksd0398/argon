name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22: npm test's quoted glob needs Node 21+ (the package itself supports 18+)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Runs every contract query against mock.shop
      - run: npm run test:live

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Generate the demo project
        run: |
          git config --global user.email "ci@argon.invalid"
          git config --global user.name "Argon CI"
          npm ci
          node bin/create.js demo --demo --yes
      # After generation, so the Gradle cache key sees the generated build files
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        working-directory: demo/android
        run: ./gradlew testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.x
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('templates/ios/App.xcodeproj/project.pbxproj') }}
      - name: Generate the demo project
        run: |
          git config --global user.email "ci@argon.invalid"
          git config --global user.name "Argon CI"
          npm ci
          node bin/create.js demo --demo --yes
      # Builds the generated project: templates/ios has no Config.xcconfig until Argon writes it
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const devices = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const phone = Object.values(devices).flat().find((d) => d.name.startsWith("iPhone"));
            if (!phone) throw new Error("No iPhone simulator available");
            console.log(phone.udid);
          ')
          xcodebuild -project demo/ios/App.xcodeproj -scheme App \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
            build test
