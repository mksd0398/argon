name: CI

# Once per change: a pull request, and main after a merge. A branch push without a pull request runs nothing (it ran
# twice before: as the push and as the pull request).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which platforms a change touches: their templates, the shared contract, the CLI that writes the projects, or CI
  # itself. Each platform's job runs only then (macOS minutes cost ten times Linux's).
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git ls-files)
          shared='^(contract/|lib/|bin/|templates/shared/|package(-lock)?\.json$|\.github/workflows/)'
          echo "android=$(echo "$files" | grep -qE "$shared|^templates/android/" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ios=$(echo "$files" | grep -qE "$shared|^templates/ios/" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22: npm test's quoted glob needs Node 21+ (the package itself supports 18+)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Runs every contract query against mock.shop
      - run: npm run test:live

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Generate the demo project
        run: |
          git config --global user.email "ci@argon.invalid"
          git config --global user.name "Argon CI"
          npm ci
          node bin/create.js demo --demo --yes
      # After generation, so the Gradle cache key sees the generated build files
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        working-directory: demo/android
        run: ./gradlew testDebugUnitTest assembleDebug

  ios:
    name: ios (Xcode ${{ matrix.xcode }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The latest stable Xcode (26) is what App Store uploads need; it is watched without blocking until Xcode 16 is dropped
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      # the experimental latest Xcode only on main, after a merge: pull requests build with Xcode 16 alone
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"runner":"macos-15","xcode":"16.x","experimental":false},{"runner":"macos-26","xcode":"latest-stable","experimental":true}]' || '[{"runner":"macos-15","xcode":"16.x","experimental":false}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      # lib/index.js names the analytics SDKs the last step resolves: a change there saves the cache again, starting
      # from the last one
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ matrix.runner }}-${{ matrix.xcode }}-${{ hashFiles('templates/ios/App.xcodeproj/project.pbxproj', 'lib/index.js') }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.runner }}-${{ matrix.xcode }}-
      - name: Generate the demo project
        run: |
          git config --global user.email "ci@argon.invalid"
          git config --global user.name "Argon CI"
          npm ci
          node bin/create.js demo --demo --yes
      # Builds the generated project: templates/ios has no Config.xcconfig until Argon writes it.
      # The simulator: an iPhone on the newest iOS runtime from 17 up to the selected Xcode's SDK (an image also carries
      # runtimes newer than that Xcode can run).
      - name: Build and test
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK="$SDK" node -e '
            const version = (text) => text.split(/[.-]/).map(Number);
            const compare = (a, b) => a[0] - b[0] || (a[1] ?? 0) - (b[1] ?? 0);
            const sdk = version(process.env.SDK);
            const runtimes = Object.entries(JSON.parse(require("fs").readFileSync(0, "utf8")).devices)
              .map(([id, devices]) => ({ match: /SimRuntime\.iOS-(\d+-\d+)/.exec(id), devices }))
              .filter((r) => r.match)
              .map((r) => ({ version: version(r.match[1]), devices: r.devices }))
              .filter((r) => r.version[0] >= 17 && compare(r.version, sdk) <= 0)
              .sort((a, b) => compare(b.version, a.version));
            for (const runtime of runtimes) {
              const phone = runtime.devices.find((d) => d.name.startsWith("iPhone"));
              if (phone) {
                console.error(`Simulator: ${phone.name}, iOS ${runtime.version.join(".")} (SDK ${process.env.SDK})`);
                console.log(phone.udid);
                process.exit(0);
              }
            }
            console.error(`No iPhone simulator on an iOS 17...${process.env.SDK} runtime`);
            process.exit(1);
          ')
          xcodebuild -project demo/ios/App.xcodeproj -scheme App \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
            build test
      # The same sources as a Swift package: what xtool builds where there is no Xcode (README, "iOS without a Mac")
      # Copied out first: beside App.xcodeproj, xcodebuild would build the project instead of the package
      - name: Build the Swift package
        run: |
          mkdir package
          cp -R demo/ios/Package.swift demo/ios/App demo/ios/ArgonUI package/
          cd package
          xcodebuild -scheme ArgonStorefront -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation build
      # The analytics sinks (Firebase, Meta, MoEngage) are compiled only in an app that has their SDKs, and the demo has
      # none: a second project with all three set up, built as a package like the one above, is what compiles them
      # against the real SDKs. On the one Xcode Firebase 13 resolves with (26.2 or later). The Firebase file is a dummy
      # for com.mockshop.analytics, the id a demo project named "analytics" gets; nothing here is run or sent.
      # ARCHS=arm64: MoEngage's SDK refuses to compile for the Intel simulator (an #error in its kmm-apple-sdk).
      - name: Build the Swift package with the analytics SDKs
        if: matrix.xcode == 'latest-stable'
        run: |
          node bin/create.js analytics --demo --yes \
            --meta-app-id=1234567890 --meta-client-token=0123456789abcdef0123456789abcdef \
            --moengage-workspace-id=TESTWORKSPACE --firebase-ios=test/fixtures/GoogleService-Info.plist
          mkdir analytics-package
          cp -R analytics/ios/Package.swift analytics/ios/App analytics/ios/ArgonUI analytics-package/
          cd analytics-package
          xcodebuild -scheme ArgonStorefront -destination "generic/platform=iOS Simulator" ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation build
